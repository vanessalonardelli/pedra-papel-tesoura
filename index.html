<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedra, Papel e Tesoura</title>
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="icon" href="data:,">
</head>
<body>

   <h1>Pedra, Papel e Tesoura</h1>

  <section class="instrucoes">
    <h2>Como jogar</h2>
    <p>Clique em pedra, papel ou tesoura. O computador escolhe ao mesmo tempo.</p>
    <p>Pedra vence tesoura, tesoura vence papel e papel vence pedra.</p>
    <p>Quem fizer 3 pontos primeiro vence a partida.</p>
  </section>

  <section class="opcoes">
    <button class="botao-escolha" data-escolha="pedra">Pedra</button>
    <button class="botao-escolha" data-escolha="papel">Papel</button>
    <button class="botao-escolha" data-escolha="tesoura">Tesoura</button>
  </section>

    <section class="arena">
    <div class="lado">
      <p class="nome">Você</p>
      <p id="jogada-jogador" class="jogada">?</p>
    </div>
    <p class="versus">X</p>
    <div class="lado">
      <p class="nome">Computador</p>
      <p id="jogada-computador" class="jogada">?</p>
    </div>
  </section>
  
  <section class="placar">
    <p>Você: <span id="pontos-jogador">0</span></p>
    <p>Computador: <span id="pontos-computador">0</span></p>
  </section>

  <p id="resultado">Faça sua jogada!</p>

  <button id="botao-reiniciar">Jogar de novo</button>

  <script src="js/jogo.js"></script>
</body>
</html>
